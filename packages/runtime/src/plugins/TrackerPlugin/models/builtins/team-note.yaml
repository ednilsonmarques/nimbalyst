type: team-note
displayName: Team Note
displayNamePlural: Team Notes
icon: sticky_note_2
color: "#0d9488"

# Distilled, durable project memory written by a Team mode coordinator: a
# decision, discovery, risk, pending item, test result, context or the handoff
# that closes a mission. Never a transcript; the session it came from keeps the
# full history.
modes:
  inline: false
  fullDocument: false

sharing: team
draftByDefault: false

idPrefix: nte
idFormat: ulid

fields:
  - name: title
    type: string
    required: true
    displayInline: true

  - name: noteKind
    type: select
    required: true
    displayInline: true
    options:
      - value: decision
        label: Decision
        icon: gavel
      - value: discovery
        label: Discovery
        icon: travel_explore
      - value: risk
        label: Risk
        icon: warning
      - value: pending
        label: Pending
        icon: pending_actions
      - value: test
        label: Test
        icon: science
      - value: context
        label: Context
        icon: info
      - value: handoff
        label: Handoff
        icon: assignment_turned_in

  - name: status
    type: select
    default: active
    options:
      - value: active
        label: Active
        icon: radio_button_checked
        category: started
      - value: resolved
        label: Resolved
        icon: check_circle
        category: done
      - value: obsolete
        label: Obsolete
        icon: history
        category: cancelled

  # The concrete next step. Required for a pending item and a handoff (the shared
  # rule enforces it on create and when the kind or the value changes).
  - name: nextAction
    type: text
    displayInline: false

  # Handoff only: how the mission ended, the commits it left, the pendings it
  # passes on and the notes it relates to. The shared rule refuses these on every
  # other kind. None declares an inverse field: a handoff never writes onto the
  # notes it points to.
  - name: result
    type: select
    displayInline: false
    options:
      - value: completed
        label: Completed
        icon: check_circle
      - value: partial
        label: Partial
        icon: timelapse
      - value: abandoned
        label: Abandoned
        icon: cancel

  - name: commits
    type: array
    itemType: string
    displayInline: false

  - name: pendings
    type: relationship
    relationshipTypeKey: hands-off
    targetTrackerTypes:
      - team-note
    multiValue: true

  - name: relatedNotes
    type: relationship
    relationshipTypeKey: related
    targetTrackerTypes:
      - team-note
    multiValue: true

  - name: files
    type: array
    itemType: string
    displayInline: false

  - name: supersedes
    type: relationship
    relationshipTypeKey: supersedes
    targetTrackerTypes:
      - team-note
    multiValue: true

  # Provenance, filled by the host from the calling session (never by the agent).
  - name: sourceSession
    type: string
    displayInline: false
    readOnly: true

  - name: teamRootSession
    type: string
    displayInline: false
    readOnly: true

  - name: agentRole
    type: string
    displayInline: false
    readOnly: true

  - name: branch
    type: string
    displayInline: false
    readOnly: true

  - name: worktree
    type: string
    displayInline: false
    readOnly: true

  # The front (a team-front) of the mission that wrote the note, copied by the
  # host from the root session. No inverse: nothing is ever written onto the front.
  - name: front
    type: relationship
    relationshipTypeKey: front
    targetTrackerTypes:
      - team-front
    displayInline: false
    readOnly: true

  - name: created
    type: datetime
    displayInline: false
    readOnly: true

  - name: updated
    type: datetime
    displayInline: false
    readOnly: true

statusBarLayout:
  - row:
    - field: noteKind
      width: 160
    - field: status
      width: 160

inlineTemplate: "{icon} {title} {status}"

roles:
  title: title
  workflowStatus: status
  tags: tags
